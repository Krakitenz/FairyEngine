name: FairyEngine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.configuration }} x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build FairyEngine
        shell: pwsh
        run: |
          msbuild "FairyEngine\FairyEngine.vcxproj" `
            /m `
            /t:Rebuild `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native tests
        shell: pwsh
        run: |
          msbuild "FairyEngine\tests\FairyEngine.Tests.vcxproj" `
            /m `
            /t:Rebuild `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        working-directory: FairyEngine
        run: |
          & ".\tests\bin\x64\${{ matrix.configuration }}\FairyEngine.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
